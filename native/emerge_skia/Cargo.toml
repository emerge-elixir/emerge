[package]
name = "emerge_skia"
version = "0.5.1"
edition = "2024"
rust-version = "1.91"

[lib]
name = "emerge_skia"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "macos_host"
path = "src/bin/macos_host.rs"
required-features = ["macos"]

[[bin]]
name = "vulkan_probe"
path = "src/bin/vulkan_probe.rs"
required-features = ["drm-vulkan", "vulkan-probe"]

[[bench]]
name = "layout"
harness = false
required-features = ["bench-diagnostics"]

[[bench]]
name = "patch"
harness = false

[[bench]]
name = "emrg"
harness = false

[[bench]]
name = "renderer"
harness = false
required-features = ["bench-diagnostics"]

[[bench]]
name = "headless_frame_copy"
harness = false

[[bench]]
name = "stats"
harness = false

[[bench]]
name = "shared_animation"
harness = false
required-features = ["bench-diagnostics"]

[features]
default = ["wayland", "opengl"]
bench-diagnostics = []
# Embedded builds provide fonts as registered assets and do not ship
# desktop fontconfig/freetype development libraries.
embedded-freetype = ["skia-safe/embed-freetype"]
# Minimal headless raster profile, including ARM/Nerves and macOS artifacts.
# CPU-rendered SVG is always available;
# desktop, GPU, and video capabilities remain absent unless explicitly selected.
embedded-cpu = ["embedded-freetype"]
video-interop-support = ["dep:video-interop"]
hover-trace = []
# Opt-in diagnostic executable. Keep this separate from drm-vulkan so Rustler
# cannot copy a host probe into the NIF's shared priv/native directory.
vulkan-probe = []
# Shared Linux OpenGL dependency bundle. Vulkan-only presenter features do not
# enable this bundle.
opengl = [
    "video-interop-support",
    "dep:gbm",
    "dep:gl",
    "dep:libloading",
    "dep:glutin",
    "dep:glutin_egl_sys",
    "gbm/import-egl",
    "skia-safe/gl",
    "video-interop/egl",
]
# The macOS host accepts owned CPU video frames. Keep Linux DMA-BUF transport
# out of this feature so the host remains an Apple-only renderer build.
macos = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "skia-safe/metal",
]
wayland = [
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wayland-backend",
    "dep:wayland-protocols",
    "dep:raw-window-handle",
    "dep:arboard",
]
# Presenter and rendering API features are independent. Raster/headless are baseline.
drm = ["dep:drm", "dep:evdev", "dep:emerge_input", "embedded-freetype"]
vulkan = ["video-interop-support", "dep:ash", "skia-safe/vulkan", "video-interop/vulkan"]
# Cargo cannot express dependency activation conditional on two features. The
# canonical resolver adds these dependency-only glue features for those pairs.
drm-vulkan-deps = ["dep:gbm"]
wayland-vulkan-deps = ["dep:ash-window"]
# Compatibility aliases for native tooling, not artifact identities.
drm-core = ["drm"]
drm-raster = ["drm"]
wayland-core = ["wayland"]
linux-opengl = ["opengl"]
headless-opengl = ["opengl"]
headless-vulkan = ["vulkan"]
headless-all = ["opengl", "vulkan"]
wayland-vulkan = ["wayland", "vulkan", "wayland-vulkan-deps"]
wayland-all = ["wayland", "opengl", "vulkan", "wayland-vulkan-deps"]
drm-vulkan = ["drm", "vulkan", "drm-vulkan-deps"]
drm-all = ["drm", "opengl", "vulkan", "drm-vulkan-deps"]

[dependencies]
rustler = "0.38"
video-interop = { version = "0.1.3", optional = true }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }
ash-window = { version = "0.13", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSAttributedString", "NSDate", "NSRange", "NSString", "NSRunLoop"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSCell", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSTextInputClient", "NSTrackingArea", "NSView", "NSWindow"], optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"], optional = true }
gl = { version = "0.14", optional = true }
libloading = { version = "0.9", optional = true }
libc = "0.2"
crossbeam-channel = "0.5"
sha2 = "0.10"
resvg = "0.48.1"
# Pinned past the 0.99.0 tag for Vulkan BackendSemaphore make/get, Surface::wait, and
# FlushInfo signal-semaphore wrappers. Exit this git pin when the first upstream rust-skia release
# containing 0d2261c63941f4b534522246cc1ace13ca4242d8 is adopted. The workspace dependency keeps
# skia-bindings coordinated at the identical immutable rust-skia revision.
skia-safe = { version = "0.99.0", git = "https://github.com/rust-skia/rust-skia", rev = "0d2261c63941f4b534522246cc1ace13ca4242d8", default-features = false, features = ["jpeg", "binary-cache"] }

[dev-dependencies]
criterion = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
glutin = { version = "0.32", optional = true }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system", "rwh_06"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
drm = { version = "0.14", optional = true }
gbm = { version = "0.18", default-features = false, features = ["drm-support"], optional = true }
glutin_egl_sys = { version = "0.7", optional = true }
# evdev is retained only for Linux key-code constants, not device/event decoding.
evdev = { version = "0.13", optional = true }
emerge_input = { path = "../emerge_input", optional = true }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
video-interop = "0.1.3"
drm-ffi = "0.9"
