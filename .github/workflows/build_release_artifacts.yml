name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  EMERGE_SOURCE_REVISION: ${{ github.sha }}

jobs:
  validate_release:
    name: Validate release source
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Set up supported Rust floor
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install dependencies
        run: mix deps.get

      - name: Verify exact release metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"
          test -n "$project_version"
          test "$project_version" = "$cargo_version"
          test "$GITHUB_REF_NAME" = "v$project_version"
          grep -Eq "^## \[$project_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git merge-base --is-ancestor v0.3.4 HEAD

      - name: Run full quality, test, and Dialyzer suite
        run: ./ci-tests.sh all

      - name: Run full-sweep Elixir tests
        run: mix test --include full_sweep --warnings-as-errors

      - name: Build documentation without warnings
        env:
          EMERGE_INCLUDE_INTERNAL_DOCS: "false"
        run: mix docs --warnings-as-errors

      - name: Validate unpacked package native sources
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/emerge-0.4.0"
          mix hex.build --unpack --output "$package_dir"
          cargo check \
            --manifest-path "$package_dir/native/emerge_skia/Cargo.toml" \
            --locked \
            --all-targets
          cargo check \
            --manifest-path "$package_dir/native/emerge_skia/Cargo.toml" \
            --locked \
            --no-default-features \
            --features embedded-cpu

  build_release:
    needs: validate_release
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - name: linux_wayland
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features wayland"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_wayland_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "wayland_vulkan"
            cargo_args: "--no-default-features --features wayland-vulkan,embedded-freetype"
            system_packages: "libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_drm
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm"
            cargo_args: "--no-default-features --features drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev"
          - name: linux_drm_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm_vulkan"
            cargo_args: "--no-default-features --features drm-vulkan,embedded-freetype"
            system_packages: "libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev"
          - name: linux_drm_wayland
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm_wayland"
            cargo_args: "--no-default-features --features wayland,drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_raster
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "raster"
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_headless_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "headless_vulkan"
            cargo_args: "--no-default-features --features headless-vulkan,embedded-freetype"
            system_packages: "libfontconfig1-dev libfreetype6-dev"
          - name: linux_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "vulkan"
            cargo_args: "--no-default-features --features wayland-all,drm-all,headless-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_wayland
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features wayland"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_wayland_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "wayland_vulkan"
            cargo_args: "--no-default-features --features wayland-vulkan,embedded-freetype"
            system_packages: "libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_drm
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm"
            cargo_args: "--no-default-features --features drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev"
          - name: linux_aarch64_drm_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm_vulkan"
            cargo_args: "--no-default-features --features drm-vulkan,embedded-freetype"
            system_packages: "libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev"
          - name: linux_aarch64_drm_wayland
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm_wayland"
            cargo_args: "--no-default-features --features wayland,drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_raster
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "raster"
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_aarch64_headless_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "headless_vulkan"
            cargo_args: "--no-default-features --features headless-vulkan,embedded-freetype"
            system_packages: "libfontconfig1-dev libfreetype6-dev"
          - name: linux_aarch64_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "vulkan"
            cargo_args: "--no-default-features --features wayland-all,drm-all,headless-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_arm32_raster
            target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            use_cross: true
            variant: ""
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_arm32_opengl
            target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            use_cross: true
            variant: "opengl"
            cargo_args: "--no-default-features --features drm,embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        env:
          # GitHub's Ubuntu ARM runners currently expose ImageOS=ubuntu24-arm64,
          # but setup-beam expects the OS-only ImageOS value and reads RUNNER_ARCH
          # separately to pick arm64 OTP builds.
          ImageOS: ubuntu24
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Install dependencies
        run: mix deps.get

      - name: Extract project version
        shell: bash
        run: |
          # Read both source manifests even on tag builds. Deriving the version
          # from the tag and comparing it back to the same tag proves nothing.
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          if [[ -z "$project_version" || -z "$cargo_version" ]]; then
            echo "Failed to resolve Mix/Cargo project versions" >&2
            exit 1
          fi

          if [[ "$project_version" != "$cargo_version" ]]; then
            echo "Mix version ${project_version} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* && "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi

          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: ${{ matrix.job.system_packages != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes ${{ matrix.job.system_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Configure ARM32 cross toolchain
        if: ${{ matrix.job.target == 'arm-unknown-linux-gnueabihf' }}
        shell: bash
        run: |
          toolchain=/x-tools/arm-unknown-linux-gnueabihf
          sysroot="$toolchain/arm-unknown-linux-gnueabihf/sysroot"
          clang_target="--target=arm-unknown-linux-gnueabihf --sysroot=$sysroot --gcc-toolchain=$toolchain"

          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "SDKTARGETSYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "CLANGCC=clang $clang_target" >> "$GITHUB_ENV"
          echo "CLANGCXX=clang++ $clang_target" >> "$GITHUB_ENV"
          echo "HOST_CC=gcc" >> "$GITHUB_ENV"
          echo "HOST_CXX=g++" >> "$GITHUB_ENV"

      - name: Configure embedded Skia
        if: ${{ matrix.job.embedded_skia == true }}
        shell: bash
        run: |
          echo "FORCE_SKIA_BUILD=1" >> "$GITHUB_ENV"
          echo "SKIA_GN_ARGS=skia_use_fontconfig=false skia_use_system_freetype2=false" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=support/embedded-linux-link-stubs" >> "$GITHUB_ENV"

      - name: Verify Vulkan-only dependency closure
        if: ${{ matrix.job.variant == 'wayland_vulkan' || matrix.job.variant == 'drm_vulkan' || matrix.job.variant == 'headless_vulkan' }}
        shell: bash
        run: |
          dependency_tree="$(cargo tree --manifest-path native/emerge_skia/Cargo.toml ${{ matrix.job.cargo_args }} --edges features)"
          if grep --extended-regexp ' gl v[0-9]|glutin|glutin_egl_sys|video-interop feature "egl"|skia-safe feature "gl"|emerge_skia feature "linux-opengl"' <<<"${dependency_tree}"; then
            echo "Vulkan-only artifact enables an OpenGL dependency or feature" >&2
            exit 1
          fi

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: emerge_skia
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use_cross && 'true' || '' }}
          cross-version: "v0.2.5"
          project-dir: native/emerge_skia
          variant: ${{ matrix.job.variant }}
          cargo-args: ${{ matrix.job.cargo_args }}

      - name: Verify embedded dependency closure
        if: ${{ matrix.job.embedded_skia == true }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/embedded-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C "$artifact_dir"
          artifact="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.so' -print -quit)"
          test -n "$artifact"
          dynamic_dependencies="$(readelf --dynamic "$artifact")"
          undefined_symbols="$(nm --dynamic --undefined-only "$artifact")"

          if grep --extended-regexp 'NEEDED.*(fontconfig|freetype)' <<<"$dynamic_dependencies"; then
            echo "Embedded artifact depends on desktop fontconfig or FreeType" >&2
            exit 1
          fi

          if grep --extended-regexp ' (Fc|FT_)' <<<"$undefined_symbols"; then
            echo "Embedded artifact contains unresolved fontconfig or FreeType symbols" >&2
            exit 1
          fi

          if [[ "${{ matrix.job.raster_only }}" == "true" ]] &&
             grep --extended-regexp 'NEEDED.*(EGL|GLES|GL|gbm|drm|wayland)' <<<"$dynamic_dependencies"; then
            echo "Raster-only artifact depends on a desktop or GPU library" >&2
            exit 1
          fi

      - name: Artifact upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-crate.outputs.file-path }}

  build_macos_host:
    needs: validate_release
    name: macos_host - ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: macos_arm64
            target: aarch64-apple-darwin
            os: macos-15
          - name: macos_x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Install dependencies
        run: mix deps.get

      - name: Extract project version
        shell: bash
        run: |
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          if [[ -z "$project_version" || -z "$cargo_version" ]]; then
            echo "Failed to resolve Mix/Cargo project versions" >&2
            exit 1
          fi

          if [[ "$project_version" != "$cargo_version" ]]; then
            echo "Mix version ${project_version} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* && "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi

          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build macos_host
        working-directory: native/emerge_skia
        run: >
          cargo build --release
          --bin macos_host
          --no-default-features
          --features macos

      - name: Package macos_host archive
        shell: bash
        run: |
          mkdir -p dist
          cp native/emerge_skia/target/release/macos_host dist/macos_host
          chmod 755 dist/macos_host
          archive="macos_host-v${PROJECT_VERSION}-${{ matrix.job.target }}.tar.gz"
          tar -C dist -czf "$archive" macos_host
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"

      - name: Artifact upload
        uses: actions/upload-artifact@v6
        with:
          name: macos_host-v${{ env.PROJECT_VERSION }}-${{ matrix.job.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

      - name: Publish macos_host archives
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
