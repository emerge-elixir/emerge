name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  EMERGE_SOURCE_REVISION: ${{ github.sha }}

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Require existing CI success for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"
      - name: Wait for successful CI without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        run: elixir scripts/require-workflow.exs "$(git rev-parse HEAD)" ci.yml

      - name: Extract project version
        id: version
        shell: bash
        run: |
          # Read both source manifests even on tag builds. Deriving the version
          # from the tag and comparing it back to the same tag proves nothing.
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          if [[ -z "$project_version" || -z "$cargo_version" ]]; then
            echo "Failed to resolve Mix/Cargo project versions" >&2
            exit 1
          fi

          if [[ "$project_version" != "$cargo_version" ]]; then
            echo "Mix version ${project_version} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* && "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi

          echo "version=$project_version" >> "$GITHUB_OUTPUT"

  build_release:
    needs: validate
    env:
      PROJECT_VERSION: ${{ needs.validate.outputs.version }}
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - name: linux_wayland
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features wayland"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_wayland_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "wayland_vulkan"
            cargo_args: "--no-default-features --features wayland-vulkan,embedded-freetype"
            system_packages: "libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_drm
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm"
            cargo_args: "--no-default-features --features drm,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_drm_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm_vulkan"
            cargo_args: "--no-default-features --features drm-vulkan,embedded-freetype"
            system_packages: "libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_drm_all
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm_all"
            cargo_args: "--no-default-features --features drm-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_drm_wayland
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "drm_wayland"
            cargo_args: "--no-default-features --features wayland,drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_raster
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "raster"
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_headless_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "headless_vulkan"
            cargo_args: "--no-default-features --features headless-vulkan,embedded-freetype"
            system_packages: "libfontconfig1-dev libfreetype6-dev"
          - name: linux_vulkan
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            variant: "vulkan"
            cargo_args: "--no-default-features --features wayland-all,drm-all,headless-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_wayland
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features wayland"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_wayland_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "wayland_vulkan"
            cargo_args: "--no-default-features --features wayland-vulkan,embedded-freetype"
            system_packages: "libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_drm
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm"
            cargo_args: "--no-default-features --features drm,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_aarch64_drm_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm_vulkan"
            cargo_args: "--no-default-features --features drm-vulkan,embedded-freetype"
            system_packages: "libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_aarch64_drm_all
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm_all"
            cargo_args: "--no-default-features --features drm-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev"
            embedded_skia: true
          - name: linux_aarch64_drm_wayland
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "drm_wayland"
            cargo_args: "--no-default-features --features wayland,drm"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_aarch64_raster
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "raster"
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_aarch64_headless_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "headless_vulkan"
            cargo_args: "--no-default-features --features headless-vulkan,embedded-freetype"
            system_packages: "libfontconfig1-dev libfreetype6-dev"
          - name: linux_aarch64_vulkan
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
            variant: "vulkan"
            cargo_args: "--no-default-features --features wayland-all,drm-all,headless-all,embedded-freetype"
            system_packages: "libegl1-mesa-dev libgbm-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev"
          - name: linux_musl_raster
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            container: musl
            profile: raster
            variant: ""
            system_packages: ""
          - name: linux_musl_opengl
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            container: musl
            profile: opengl
            variant: "opengl"
            system_packages: ""
          - name: linux_riscv64_raster
            target: riscv64gc-unknown-linux-gnu
            os: ubuntu-24.04
            container: riscv64
            profile: raster
            variant: ""
            system_packages: ""
          - name: linux_riscv64_opengl
            target: riscv64gc-unknown-linux-gnu
            os: ubuntu-24.04
            container: riscv64
            profile: opengl
            variant: "opengl"
            system_packages: ""
          - name: macos_arm64_raster
            target: aarch64-apple-darwin
            os: macos-15
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            macos_raster: true
          - name: macos_x86_64_raster
            target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
            variant: ""
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            macos_raster: true
          - name: linux_armv7_raster
            target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            use_cross: true
            variant: ""
            cargo_args: "--no-default-features --features embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: true
          - name: linux_armv7_opengl
            target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            use_cross: true
            variant: "opengl"
            cargo_args: "--no-default-features --features drm,embedded-cpu"
            system_packages: ""
            embedded_skia: true
            raster_only: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Normalize Linux image name for setup-beam
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        # Ubuntu ARM exposes ubuntu24-arm64; setup-beam reads RUNNER_ARCH separately.
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Install Linux build dependencies
        if: ${{ matrix.job.system_packages != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes ${{ matrix.job.system_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.job.target }}

      - name: Configure ARMv7 cross toolchain
        if: ${{ matrix.job.target == 'armv7-unknown-linux-gnueabihf' }}
        shell: bash
        run: |
          sysroot=/usr/arm-linux-gnueabihf
          clang_target="--target=armv7-unknown-linux-gnueabihf --sysroot=$sysroot"

          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "SDKTARGETSYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "CLANGCC=clang $clang_target" >> "$GITHUB_ENV"
          echo "CLANGCXX=clang++ $clang_target" >> "$GITHUB_ENV"
          echo "HOST_CC=gcc" >> "$GITHUB_ENV"
          echo "HOST_CXX=g++" >> "$GITHUB_ENV"

      - name: Configure embedded Skia
        if: ${{ matrix.job.embedded_skia == true }}
        shell: bash
        run: |
          echo "FORCE_SKIA_BUILD=1" >> "$GITHUB_ENV"
          echo "SKIA_GN_ARGS=skia_use_fontconfig=false skia_use_system_freetype2=false" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=support/embedded-linux-link-stubs" >> "$GITHUB_ENV"

      - name: Configure macOS raster Skia
        if: ${{ matrix.job.macos_raster == true }}
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "FORCE_SKIA_BUILD=1" >> "$GITHUB_ENV"

      - name: Verify Vulkan-only dependency closure
        if: ${{ matrix.job.variant == 'wayland_vulkan' || matrix.job.variant == 'drm_vulkan' || matrix.job.variant == 'headless_vulkan' }}
        shell: bash
        run: |
          dependency_tree="$(cargo tree --manifest-path native/emerge_skia/Cargo.toml ${{ matrix.job.cargo_args }} --edges features)"
          if grep --extended-regexp ' gl v[0-9]|glutin|glutin_egl_sys|video-interop feature "egl"|skia-safe feature "gl"|emerge_skia feature "linux-opengl"' <<<"${dependency_tree}"; then
            echo "Vulkan-only artifact enables an OpenGL dependency or feature" >&2
            exit 1
          fi

      - name: Build embedded musl and RISC-V artifacts
        if: ${{ matrix.job.container != '' }}
        id: build-container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t emerge-embedded \
            -f native/emerge_skia/support/release/Dockerfile.${{ matrix.job.container }} \
            native/emerge_skia/support/release
          artifact_dir="$RUNNER_TEMP/embedded-artifacts"
          mkdir -p "$artifact_dir"
          docker run --rm --env EMERGE_SOURCE_REVISION \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$artifact_dir,target=/artifacts" \
            emerge-embedded '${{ matrix.job.target }}' '${{ matrix.job.profile }}' \
            "$PROJECT_VERSION" '${{ matrix.nif }}'
          suffix='${{ matrix.job.variant }}'
          if [[ -n "$suffix" ]]; then suffix="--$suffix"; fi
          name="libemerge_skia-v$PROJECT_VERSION-nif-${{ matrix.nif }}-${{ matrix.job.target }}$suffix.so.tar.gz"
          test -s "$artifact_dir/$name"
          echo "file-name=$name" >> "$GITHUB_OUTPUT"
          echo "file-path=$artifact_dir/$name" >> "$GITHUB_OUTPUT"

      - name: Build the project
        if: ${{ matrix.job.container == '' }}
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: emerge_skia
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use_cross && 'true' || '' }}
          cross-version: "v0.2.5"
          project-dir: native/emerge_skia
          variant: ${{ matrix.job.variant }}
          cargo-args: --locked --lib ${{ matrix.job.cargo_args }}

      - name: Verify packaged embedded ABI and dependency closure
        if: ${{ matrix.job.embedded_skia == true }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/embedded-artifact"
          mkdir -p "$artifact_dir"
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C "$artifact_dir"
          artifacts=("$artifact_dir"/*.so)
          test "${#artifacts[@]}" = 1
          profile='${{ matrix.job.variant }}'
          if [[ '${{ matrix.job.raster_only }}' == true ]]; then profile=raster; fi
          elixir scripts/check-embedded-artifact.exs "${artifacts[0]}" '${{ matrix.job.target }}' "$profile"

      - name: Artifact upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build-crate.outputs.file-name || steps.build-container.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path || steps.build-container.outputs.file-path }}
          if-no-files-found: error

  build_macos_host:
    needs: validate
    env:
      PROJECT_VERSION: ${{ needs.validate.outputs.version }}
    name: macos_host - ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: macos_arm64
            target: aarch64-apple-darwin
            os: macos-15
          - name: macos_x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.job.target }}

      - name: Build macos_host
        working-directory: native/emerge_skia
        run: >
          cargo build --locked --release
          --bin macos_host
          --no-default-features
          --features macos

      - name: Package macos_host archive
        shell: bash
        run: |
          mkdir -p dist
          cp native/emerge_skia/target/release/macos_host dist/macos_host
          chmod 755 dist/macos_host
          archive="macos_host-v${PROJECT_VERSION}-${{ matrix.job.target }}.tar.gz"
          tar -C dist -czf "$archive" macos_host
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"

      - name: Artifact upload
        uses: actions/upload-artifact@v6
        with:
          name: macos_host-v${{ env.PROJECT_VERSION }}-${{ matrix.job.target }}
          if-no-files-found: error
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

  verify_rpi5:
    name: Load packaged DRM NIFs on stock RPi5 userspace
    needs: [validate, build_release]
    runs-on: ubuntu-24.04-arm
    env:
      PROJECT_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: libemerge_skia-*-aarch64-unknown-linux-gnu--drm*.so.tar.gz
          path: release-assets
          merge-multiple: true
      - name: Fetch checksum-pinned stock Nerves RPi5 rootfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --assume-yes squashfs-tools
          archive="$RUNNER_TEMP/rpi5.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/nerves-project/nerves_system_rpi5/releases/download/v2.0.1/nerves_system_rpi5-portable-2.0.1-715A070.tar.gz \
            --output "$archive"
          echo "a1084a76f8064ec44b322f667da5d304ea001b0bcdfb2f9a34c143cfc9164ef0  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" nerves_system_rpi5-portable-2.0.1-715A070/images/rootfs.squashfs
          sudo unsquashfs -d "$RUNNER_TEMP/rpi5-root" \
            "$RUNNER_TEMP/nerves_system_rpi5-portable-2.0.1-715A070/images/rootfs.squashfs"
      - name: Resolve all NIF dependencies using only the stock rootfs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpi5-root"
          cc -Wall -Wextra -Werror native/emerge_skia/support/release/load.c -o "$RUNNER_TEMP/load-nif" -ldl
          # Avoid /tmp and other absolute symlinks inside an extracted rootfs.
          sudo mkdir "$root/emerge-smoke"
          sudo cp "$RUNNER_TEMP/load-nif" "$root/emerge-smoke/"
          for profile in drm drm_vulkan drm_all; do
            name="libemerge_skia-v$PROJECT_VERSION-nif-2.15-aarch64-unknown-linux-gnu--$profile.so"
            sudo tar -xzf "release-assets/$name.tar.gz" -C "$root/emerge-smoke" "$name"
            sudo chroot "$root" /emerge-smoke/load-nif "/emerge-smoke/$name"
          done
          # This is an eager dlopen/ABI check, not BEAM, GPU or physical-board qualification.

  publish:
    name: Publish validated release assets
    needs: [validate, build_release, build_macos_host, verify_rpi5]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable tag and default-branch integration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

      - name: Download all completed build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set up Elixir for release checks
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Prepare release notes
        run: elixir scripts/release-notes.exs "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # create fails if the release already exists: never replace published hashes.
          # Upload to a draft first; an upload failure must not expose a partial release.
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --target "$(git rev-parse HEAD)" --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
