name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  EMERGE_SOURCE_REVISION: ${{ github.sha }}
  CARGO_NET_RETRY: "5"

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Require existing CI success for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"
      - name: Wait for successful CI without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        run: elixir scripts/require-workflow.exs "$(git rev-parse HEAD)" ci.yml

      - name: Extract project version
        id: version
        shell: bash
        run: |
          # Read both source manifests even on tag builds. Deriving the version
          # from the tag and comparing it back to the same tag proves nothing.
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          if [[ -z "$project_version" || -z "$cargo_version" ]]; then
            echo "Failed to resolve Mix/Cargo project versions" >&2
            exit 1
          fi

          if [[ "$project_version" != "$cargo_version" ]]; then
            echo "Mix version ${project_version} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* && "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi

          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical native profiles
        id: matrix
        run: |
          echo "jobs=$(elixir scripts/native-release-matrix.exs)" >> "$GITHUB_OUTPUT"

  build_release:
    needs: validate
    env:
      PROJECT_VERSION: ${{ needs.validate.outputs.version }}
      EMERGE_INPUT_CACHE_DIR: ${{ github.workspace }}/.cache/emerge-input
    name: Native - ${{ matrix.builder.name }} (${{ matrix.builder.artifact_count }} archives)
    runs-on: ${{ matrix.builder.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        builder: ${{ fromJSON(needs.validate.outputs.matrix) }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Prepare input source cache mount
        if: ${{ runner.os == 'Linux' }}
        run: mkdir -p "$EMERGE_INPUT_CACHE_DIR"

      - name: Restore verified input source archives
        id: input-sources
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.EMERGE_INPUT_CACHE_DIR }}/*.tar.*
          key: input-sources-v1-${{ hashFiles('native/emerge_input/sources.rs') }}

      - name: Normalize Linux image name for setup-beam
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        # Ubuntu ARM exposes ubuntu24-arm64; setup-beam reads RUNNER_ARCH separately.
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Install Linux build dependencies once
        if: ${{ matrix.builder.system_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes ${{ matrix.builder.system_packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ join(matrix.builder.targets, ',') }}

      - name: Install ARMv7 cross builder once
        if: ${{ matrix.builder.use_cross == true }}
        uses: giantswarm/install-binary-action@v2.0.0
        with:
          binary: cross
          version: v0.2.5
          download_url: https://github.com/cross-rs/cross/releases/download/${version}/cross-x86_64-unknown-linux-gnu.tar.gz
          tarball_binary_path: cross
          smoke_test: cross --version

      - name: Configure ARMv7 cross toolchain
        if: ${{ matrix.builder.use_cross == true }}
        run: |
          sysroot=/usr/arm-linux-gnueabihf
          clang_target="--target=armv7-unknown-linux-gnueabihf --sysroot=$sysroot"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "SDKTARGETSYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "CLANGCC=clang $clang_target" >> "$GITHUB_ENV"
          echo "CLANGCXX=clang++ $clang_target" >> "$GITHUB_ENV"
          echo "HOST_CC=gcc" >> "$GITHUB_ENV"
          echo "HOST_CXX=g++" >> "$GITHUB_ENV"

      - name: Configure macOS deployment floor
        if: ${{ matrix.builder.macos == true }}
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build and verify all exact profiles with shared Cargo output
        run: >
          elixir scripts/build-native-artifacts.exs '${{ matrix.builder.name }}'
          "$PROJECT_VERSION" "$RUNNER_TEMP/native-artifacts"

      - name: Verify packaged macOS raster NIF in BEAM
        if: ${{ matrix.builder.macos == true }}
        env:
          MIX_ENV: prod
          EMERGE_SKIA_CHECKSUM_ONLY: "true"
        run: |
          set -euo pipefail
          # The NIF was snapshotted before building the Metal host.
          archives=("$RUNNER_TEMP/native-artifacts"/libemerge_skia-*.so.tar.gz)
          test "${#archives[@]}" = 1
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
          mix run --no-start scripts/smoke-raster-artifact.exs "${archives[0]}"

      - name: Verify input source cache before saving
        id: input-source-cache
        if: ${{ always() && !cancelled() && runner.os == 'Linux' && steps.input-sources.outputs.cache-hit != 'true' }}
        run: elixir scripts/check-input-source-cache.exs "$EMERGE_INPUT_CACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Save verified input source archives
        if: ${{ always() && !cancelled() && steps.input-source-cache.outputs.complete == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.EMERGE_INPUT_CACHE_DIR }}/*.tar.*
          key: ${{ steps.input-sources.outputs.cache-primary-key }}

      - name: Artifact upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.builder.name }}
          path: ${{ runner.temp }}/native-artifacts/*
          if-no-files-found: error

  verify_rpi5:
    name: Load packaged DRM NIFs on stock RPi5 userspace
    needs: [validate, build_release]
    runs-on: ubuntu-24.04-arm
    env:
      PROJECT_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: native-linux_aarch64
          path: release-assets
          merge-multiple: true
      - name: Fetch checksum-pinned stock Nerves RPi5 rootfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --assume-yes squashfs-tools
          archive="$RUNNER_TEMP/rpi5.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/nerves-project/nerves_system_rpi5/releases/download/v2.0.1/nerves_system_rpi5-portable-2.0.1-715A070.tar.gz \
            --output "$archive"
          echo "a1084a76f8064ec44b322f667da5d304ea001b0bcdfb2f9a34c143cfc9164ef0  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" nerves_system_rpi5-portable-2.0.1-715A070/images/rootfs.squashfs
          sudo unsquashfs -d "$RUNNER_TEMP/rpi5-root" \
            "$RUNNER_TEMP/nerves_system_rpi5-portable-2.0.1-715A070/images/rootfs.squashfs"
      - name: Resolve all NIF dependencies using only the stock rootfs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpi5-root"
          cc -Wall -Wextra -Werror native/emerge_skia/support/release/load.c -o "$RUNNER_TEMP/load-nif" -ldl
          # Avoid /tmp and other absolute symlinks inside an extracted rootfs.
          sudo mkdir "$root/emerge-smoke"
          sudo cp "$RUNNER_TEMP/load-nif" "$root/emerge-smoke/"
          for profile in drm drm_opengl drm_vulkan drm_opengl_vulkan; do
            name="libemerge_skia-v$PROJECT_VERSION-nif-2.15-aarch64-unknown-linux-gnu--$profile.so"
            sudo tar -xzf "release-assets/$name.tar.gz" -C "$root/emerge-smoke" "$name"
            sudo chroot "$root" /emerge-smoke/load-nif "/emerge-smoke/$name"
          done
          # This is an eager dlopen/ABI check, not BEAM, GPU or physical-board qualification.

  publish:
    name: Publish validated release assets
    needs: [validate, build_release, verify_rpi5]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable tag and default-branch integration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

      - name: Download all completed build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set up Elixir for release checks
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Prepare release notes
        run: elixir scripts/release-notes.exs "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # create fails if the release already exists: never replace published hashes.
          # Upload to a draft first; an upload failure must not expose a partial release.
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --target "$(git rev-parse HEAD)" --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
