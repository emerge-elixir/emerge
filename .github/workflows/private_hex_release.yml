name: Hex Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact v-prefixed release tag to publish
        required: true
  workflow_run:
    workflows: ["Build Release Artifacts"]
    types: [completed]

jobs:
  publish:
    name: Publish Hex package
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read

    steps:
      - name: Checkout source code (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Checkout source code (after precompiled build)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.4"

      - name: Set up supported Rust floor
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install dependencies
        run: mix deps.get

      - name: Validate exact release tag and project version
        shell: bash
        env:
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          if [[ -z "$project_version" || -z "$cargo_version" ]]; then
            echo "Failed to resolve Mix/Cargo project versions" >&2
            exit 1
          fi

          if [[ "$project_version" != "$cargo_version" ]]; then
            echo "Mix version ${project_version} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

          expected_tag="v${project_version}"
          if ! git tag --points-at HEAD | grep -Fx "$expected_tag" >/dev/null; then
            echo "Checked-out commit is not exact release tag ${expected_tag}" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$MANUAL_REF" != "$expected_tag" ]]; then
            echo "Manual ref ${MANUAL_REF} must equal ${expected_tag}" >&2
            exit 1
          fi

          grep -Eq "^## \[$project_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git merge-base --is-ancestor v0.3.4 HEAD
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Revalidate exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          ./ci-tests.sh all
          mix test --include full_sweep --warnings-as-errors
          EMERGE_INCLUDE_INTERNAL_DOCS=false mix docs --warnings-as-errors
          package_dir="$RUNNER_TEMP/emerge-${PROJECT_VERSION}"
          mix hex.build --unpack --output "$package_dir"
          cargo check \
            --manifest-path "$package_dir/native/emerge_skia/Cargo.toml" \
            --locked \
            --all-targets
          cargo check \
            --manifest-path "$package_dir/native/emerge_skia/Cargo.toml" \
            --locked \
            --no-default-features \
            --features embedded-cpu

      - name: Verify macOS host release assets exist
        shell: bash
        run: |
          set -euo pipefail

          release_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${PROJECT_VERSION}"
          release_json="$(mktemp)"
          visible_assets_file="$(mktemp)"
          missing_assets_file="$(mktemp)"

          required_assets=(
            "macos_host-v${PROJECT_VERSION}-aarch64-apple-darwin.tar.gz"
            "macos_host-v${PROJECT_VERSION}-aarch64-apple-darwin.tar.gz.sha256"
            "macos_host-v${PROJECT_VERSION}-x86_64-apple-darwin.tar.gz"
            "macos_host-v${PROJECT_VERSION}-x86_64-apple-darwin.tar.gz.sha256"
          )

          for attempt in $(seq 1 30); do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: emerge-skia-release" \
              "$release_url" > "$release_json"

            jq -r '.assets[].name // empty' "$release_json" | sort > "$visible_assets_file"
            : > "$missing_assets_file"

            for asset in "${required_assets[@]}"; do
              if ! grep -Fx "$asset" "$visible_assets_file" >/dev/null; then
                printf '%s\n' "$asset" >> "$missing_assets_file"
              fi
            done

            if [[ ! -s "$missing_assets_file" ]]; then
              echo "Found all required macOS host release assets."
              cat "$visible_assets_file"
              exit 0
            fi

            echo "Release tag: $(jq -r '.tag_name' "$release_json")"
            echo "Release updated_at: $(jq -r '.updated_at' "$release_json")"
            echo "Assets currently visible from release API:"
            cat "$visible_assets_file"

            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for macOS host release assets to appear (attempt ${attempt}/30)"
              sleep 10
            fi
          done

          while IFS= read -r asset; do
            echo "Missing required macOS host release asset: $asset" >&2
          done < "$missing_assets_file"

          exit 1

      - name: Generate precompiled checksum file
        env:
          EMERGE_SKIA_CHECKSUM_ONLY: "true"
          MIX_ENV: prod
        run: mix rustler_precompiled.download EmergeSkia.Native --all --print

      - name: Verify Hex package contents
        run: mix hex.build --unpack

      - name: Publish package and docs to Hex
        env:
          EMERGE_INCLUDE_INTERNAL_DOCS: "false"
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        shell: bash
        run: |
          unset HEX_ORGANIZATION
          mix hex.publish --yes
