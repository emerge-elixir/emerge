name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci_linux:
    name: Linux CI / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust 1.91.0
            rust: "1.91.0"
            elixir: "1.20.2"
            otp: "29.0.5"
          - name: Rust stable
            rust: stable
            elixir: "1.20.2"
            otp: "29.0.5"
          - name: Elixir 1.19 minimum
            rust: "1.91.0"
            elixir: "1.19.0"
            # OTP 28.0 emits Elixir regex startup warnings; use the fixed 28.1 line.
            otp: "28.1.1"
            minimum: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Cache Mix dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/emerge_skia/target
          # Keep the minimum-Elixir job from claiming the full Rust job's immutable cache.
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.name }}-${{ hashFiles('native/emerge_skia/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.name }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run CI test script
        if: ${{ matrix.minimum != true }}
        run: ./ci-tests.sh

      - name: Compile and test the minimum supported Elixir
        if: ${{ matrix.minimum == true }}
        run: |
          mix compile --warnings-as-errors
          mix test --include full_sweep --warnings-as-errors

      - name: Validate source metadata
        if: ${{ matrix.rust == '1.91.0' && matrix.minimum != true }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(awk -F'"' '/^  @version "/ { print $2; exit }' mix.exs)"
          cargo_version="$(awk -F'"' '$0 == "[package]" { in_package=1; next } in_package && /^version = "/ { print $2; exit }' native/emerge_skia/Cargo.toml)"

          test -n "$project_version"
          test "$project_version" = "$cargo_version"
          grep -Eq "^## \[$project_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git merge-base --is-ancestor v0.3.4 HEAD

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$project_version"
          fi

          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Run additional full-sweep Elixir tests
        if: ${{ matrix.rust == '1.91.0' && matrix.minimum != true }}
        run: mix test --only full_sweep --warnings-as-errors

      - name: Build documentation without warnings
        if: ${{ matrix.rust == '1.91.0' && matrix.minimum != true }}
        env:
          EMERGE_INCLUDE_INTERNAL_DOCS: "false"
        run: |
          mix docs.screenshots --check
          mix docs --warnings-as-errors
          elixir scripts/check-doc-links.exs doc

      - name: Validate unpacked package sources, screenshots and docs
        if: ${{ matrix.rust == '1.91.0' && matrix.minimum != true }}
        run: bash scripts/check-package.sh

      - name: Audit dependencies
        if: ${{ matrix.rust == 'stable' }}
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file native/emerge_skia/Cargo.lock --deny warnings
          mix hex.audit

  ci_macos:
    name: macOS CI
    runs-on: macos-15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-elixir-1.20.2-otp-29.0.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-elixir-1.20.2-otp-29.0.5-

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/emerge_skia/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/emerge_skia/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Run CI test script
        run: ./ci-tests.sh
